name: Build and publish to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set scoped package name for GitHub Packages
        run: npm pkg set name="@${{ github.repository_owner }}/react-ansiart"

      - name: Set version
        env:
          GIT_REF: ${{ github.ref }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            # Tagged release: use the tag as the version (strip leading 'v')
            npm version --no-git-tag-version "${TAG_NAME#v}"
          else
            # Dev build: use base version + short SHA for a unique prerelease
            BASE_VERSION=$(node -p "require('./package.json').version")
            npm version --no-git-tag-version "${BASE_VERSION}-dev.$(git rev-parse --short HEAD)"
          fi

      - name: Publish to GitHub Packages
        run: npm publish --access restricted --tag ${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'dev' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
