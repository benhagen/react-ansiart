name: CI and publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Guards the tree-shaking guarantees in bundle-budgets.json. A static import
      # added for a conditionally-rendered feature is invisible to tsc, eslint and
      # the tests, and only shows up as bytes in a consumer's bundle.
      - name: Bundle size
        run: npm run size

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.
      # Pinned exactly: this job holds OIDC publish rights, so the npm version
      # it runs must be a deliberate choice, not whatever @latest resolves to.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$TAG_NAME" ]; then
            echo "Tag $TAG_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      # prepublishOnly runs typecheck + tests + build before the tarball is created.
      # Auth: OIDC via the Trusted Publisher configured in the package's npmjs
      # settings (repo benhagen/react-ansiart, workflow publish-npm.yml) — no
      # token or secret involved; provenance is generated automatically.
      - name: Publish to npm
        run: npm publish --provenance --access public

  publish-github-packages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install dependencies
        run: npm ci

      - name: Set scoped package name for GitHub Packages
        run: npm pkg set name="@${{ github.repository_owner }}/react-ansiart"

      - name: Publish mirror to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
